[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "paer-forecasting"
version = "2026.11.8"
description = "Pool-Aware Expert Refinement for retrieval-augmented time-series forecasting"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=1.5", "torch>=2.1"]

[project.optional-dependencies]
encoder = ["sentence-transformers>=3.0"]

[tool.setuptools]
packages = ["paer"]
